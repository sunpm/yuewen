[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/console"
  to = "/console/index.html"
  status = 200
[[redirects]]
  from = "/console/*"
  to = "/console/index.html"
  status = 200
[[redirects]]
  from = "/m/*"
  to = "/m/index.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
