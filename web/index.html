<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F8F9F6" />
    <meta
      name="description"
      content="阅纹，看见你的阅读轨迹。把微信读书的时间、书架与划线，整理成属于你的阅读档案。"
    />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mark-light.svg" />
    <title>阅纹 · 看见你的阅读轨迹</title>
    <script>
      let preference = 'auto'
      try {
        preference = localStorage.getItem('yuewen-theme') || 'auto'
      } catch {}
      const dark =
        preference === 'dark' ||
        (preference !== 'light' &&
          typeof matchMedia === 'function' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#141A17' : '#F8F9F6')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>请启用 JavaScript 查看阅纹。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
